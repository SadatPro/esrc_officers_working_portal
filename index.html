    html, body {

    /* Ambient HIG Mesh Backdrop */
    .hig-bg {
      background-color: #f4f6fa;
      background-image:
        radial-gradient(at 10% 12%, rgba(37, 99, 235, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(16, 185, 129, 0.07) 0px, transparent 45%),
        radial-gradient(at 50% 92%, rgba(99, 102, 241, 0.06) 0px, transparent 55%);
    }
    .dark .hig-bg {
      background-color: #0b0e14;
      background-image:
        radial-gradient(at 10% 12%, rgba(59, 130, 246, 0.13) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(16, 185, 129, 0.09) 0px, transparent 45%),
        radial-gradient(at 50% 92%, rgba(99, 102, 241, 0.10) 0px, transparent 55%);
    }

    /* Frosted Glass Surface */
    .hig-glass {
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
    }

    /* Tactile HIG Card Hover & Transitions */
    .hig-card {
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .hig-card:hover {
      transform: translateY(-2px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .animate-shake {
      animation: shake 0.34s ease-in-out;
    }

    /* Subtle Scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.28); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(128, 128, 128, 0.45); }

    /* A4 Official Printable Document Sheet */
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      background: #ffffff;
      color: #0f172a;
      padding: 16mm 18mm;
      box-sizing: border-box;
      margin: 0 auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    @media screen and (max-width: 840px) {
      .a4-sheet {
        width: 100%;
        min-height: auto;
        padding: 20px;
      }
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        background: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #app, #modal-root, #toast-root {
        display: none !important;
      }
      #print-root {
        display: block !important;
        position: static !important;
      }
      .a4-sheet {
        width: 210mm !important;
        min-height: 297mm !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 15mm 17mm !important;
      }
    }

      function sealCredential(slot, user, pass) {
        const raw = `${slot}:${String(user || '').trim().toLowerCase()}:${String(pass || '')}`;
        const rev = raw.split('').reverse().join('');
        let hex = '';
        for (let i = 0; i < rev.length; i++) {
          hex += (rev.charCodeAt(i) ^ 0x5A).toString(16).padStart(2, '0');
        }
        return hex;
      }

      function constantTimeEqual(a, b) {
        if (!a || !b || a.length !== b.length) return false;
        let diff = 0;
        for (let i = 0; i < a.length; i++) {
          diff |= a.charCodeAt(i) ^ b.charCodeAt(i);
        }
        return diff === 0;
      }

      function matchDirectoryUser(list, preferredSlot, userInput, passInput) {

        candidates.forEach(u => {

        });
        for (let i = 0; i < ordered.length; i++) {
          const target = ordered[i];
          const computed = sealCredential(target.slot, userInput, passInput);
          if (constantTimeEqual(computed, target.seal)) {

      function loadJSON(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return JSON.parse(JSON.stringify(fallback));
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : JSON.parse(JSON.stringify(fallback));
        } catch (e) {
          return JSON.parse(JSON.stringify(fallback));
        }
      }

      async function syncUsersFromSupabase(silent = true) {
        if (!sbClient) {
          state.authCloudStatus = 'offline';
          return state.users;
        }
        try {
          const res = await sbClient
            .from(SUPABASE_CONFIG.USERS_TABLE)
            .select('*')
            .order('slot', { ascending: true });

          if (res.error) {
            if (res.error.code === '42P01' || res.error.code === 'PGRST205' || /esrc_users/i.test(res.error.message || '')) {
              state.authCloudStatus = 'setup-needed';
            } else {
              state.authCloudStatus = 'offline';
            }
            if (!silent) showToast('Run SQL setup to activate Supabase Login table', 'error');
            return state.users;
          }

          const data = res.data || [];
          if (data.length === 0) {
            const seedUsers = DEFAULT_USERS.map(u => ({
              id: u.id,
              role: u.role,
              slot: Number(u.slot || 0),
              code: u.code,
              name: u.name,
              title: u.title || u.wing || 'ESRC Member',
              avatar: u.avatar,
              accent: u.accent,
              seal: u.seal,
              active: u.active !== false,
              last_login_at: u.last_login_at || null
            }));
            await sbClient.from(SUPABASE_CONFIG.USERS_TABLE).upsert(seedUsers);
            state.users = seedUsers.map(u => Object.assign({}, u, { wing: u.title }));
          } else {
            state.users = data.map(u => Object.assign({}, u, { wing: u.title }));
          }

          saveJSON(STORAGE_KEYS.USERS, state.users);
          state.authCloudStatus = 'synced';
          return state.users;
        } catch (e) {
          state.authCloudStatus = 'offline';
          return state.users;
        }
      }

      async function upsertUserToSupabase(userObj) {
        const clean = {
          id: userObj.id,
          role: userObj.role,
          slot: Number(userObj.slot || 0),
          code: userObj.code,
          name: userObj.name,
          title: userObj.title || userObj.wing || 'ESRC Member',
          avatar: userObj.avatar,
          accent: userObj.accent || 'from-emerald-500 to-teal-600',
          seal: userObj.seal,
          active: userObj.active !== false,
          last_login_at: userObj.last_login_at || null
        };
        const idx = state.users.findIndex(u => u.id === clean.id);
        if (idx >= 0) state.users[idx] = Object.assign({}, clean, { wing: clean.title });
        else state.users.push(Object.assign({}, clean, { wing: clean.title }));
        saveJSON(STORAGE_KEYS.USERS, state.users);

        if (!sbClient || state.authCloudStatus === 'setup-needed') return false;
        try {
          const res = await sbClient.from(SUPABASE_CONFIG.USERS_TABLE).upsert(clean);
          if (!res.error) {
            state.authCloudStatus = 'synced';
            return true;
          }
        } catch (e) {}
        return false;
      }

      async function authenticateWithSupabase(role, preferredSlot, userInput, passInput) {
        await syncUsersFromSupabase(true);
        const list = role === 'admin' ? getAdminDirectory() : getOfficerDirectory();
        const matched = matchDirectoryUser(list, preferredSlot, userInput, passInput);
        if (!matched) return null;

        matched.last_login_at = Date.now();
        await upsertUserToSupabase(matched);
        return matched;
      }

      async function pushRecordToSupabase(kind, item) {
        saveJSON(KIND_TO_STORAGE[kind], state[kind]);
        if (!sbClient || state.cloudStatus === 'setup-needed') return;
        try {
          const res = await sbClient.from(SUPABASE_CONFIG.TABLE).upsert({
            id: item.id,
            kind: kind,
            payload: item,
            created_at: item.at || Date.now()
          });
          if (!res.error) {
            state.cloudStatus = 'synced';
            state.lastSyncAt = Date.now();
          }
        } catch (e) {}
      }

      async function deleteRecordFromSupabase(kind, id) {
        state[kind] = state[kind].filter(x => x.id !== id);
        saveJSON(KIND_TO_STORAGE[kind], state[kind]);
        if (!sbClient || state.cloudStatus === 'setup-needed') return;
        try {
          await sbClient.from(SUPABASE_CONFIG.TABLE).delete().eq('id', id);
        } catch (e) {}
      }

      async function syncPullFromSupabase(silent = false) {
        await syncUsersFromSupabase(true);
        if (!sbClient) {
          state.cloudStatus = 'offline';
          if (state.user) renderApp();
          else renderLogin();
          return;
        }
        try {
          const res = await sbClient
            .from(SUPABASE_CONFIG.TABLE)
            .select('*')
            .order('created_at', { ascending: false });

          if (res.error) {
            if (res.error.code === '42P01' || res.error.code === 'PGRST205' || /esrc_records/i.test(res.error.message || '')) {
              state.cloudStatus = 'setup-needed';
              if (!silent) showToast('Supabase table not found — click SETUP DB SQL', 'error');
            } else {
              state.cloudStatus = 'offline';
              if (!silent) showToast('Supabase sync unavailable (using local cache)', 'error');
            }
            if (state.user) renderApp();
            else renderLogin();
            return;
          }

          const rows = res.data || [];
          if (rows.length === 0) {
            // Seed initial records into empty cloud table
            const seedRows = [];
            ['notices', 'tasks', 'applications', 'resources', 'members', 'messages'].forEach(kind => {
              (state[kind] || []).forEach(item => {
                seedRows.push({
                  id: item.id,
                  kind: kind,
                  payload: item,
                  created_at: item.at || Date.now()
                });
              });
            });
            if (seedRows.length) {
              await sbClient.from(SUPABASE_CONFIG.TABLE).upsert(seedRows);
            }
          } else {
            const grouped = { notices: [], tasks: [], applications: [], resources: [], members: [], messages: [] };
            rows.forEach(r => {
              if (grouped[r.kind] && r.payload) {
                grouped[r.kind].push(r.payload);
              }
            });
            ['notices', 'tasks', 'applications', 'resources'].forEach(kind => {
              state[kind] = grouped[kind].sort((a, b) => (b.at || 0) - (a.at || 0));
              saveJSON(KIND_TO_STORAGE[kind], state[kind]);
            });
            if (grouped.members && grouped.members.length > 0) {
              state.members = grouped.members.sort((a, b) => (a.id || '').localeCompare(b.id || '', undefined, { numeric: true }));
              saveJSON(STORAGE_KEYS.MEMBERS, state.members);
            }
            if (grouped.messages) {
              state.messages = grouped.messages.sort((a, b) => (b.at || 0) - (a.at || 0));
              saveJSON(STORAGE_KEYS.MESSAGES, state.messages);
            }
          }

          state.cloudStatus = 'synced';
          state.lastSyncAt = Date.now();
          if (!silent) showToast('Synced with Supabase cloud', 'success');
          if (state.user) renderApp();
          else renderLogin();
        } catch (err) {
          state.cloudStatus = 'offline';
          if (state.user) renderApp();
          else renderLogin();
        }
      }

      let syncTimer = null;
      function startSupabaseAutoSync() {
        if (syncTimer) clearInterval(syncTimer);
        syncTimer = setInterval(() => {
          if (document.visibilityState === 'visible' && state.user) {
            syncPullFromSupabase(true);
          }
        }, 20000);
        window.addEventListener('focus', () => {
          if (state.user) syncPullFromSupabase(true);
        });
      }

      function initTheme() {
        const saved = localStorage.getItem(STORAGE_KEYS.THEME);
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = saved ? saved === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', isDark);
      }

      function toggleTheme() {
        const isDark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem(STORAGE_KEYS.THEME, isDark ? 'dark' : 'light'); } catch (e) {}
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeUrl(u) {
        let s = String(u || '').trim();
        if (!s) return null;
        if (!/^[a-z]+:\/\//i.test(s)) s = 'https://' + s;
        try {
          const parsed = new URL(s);
          return /^https?:$/.test(parsed.protocol) ? parsed.href : null;
        } catch (e) {
          return null;
        }
      }

      function detectLinkKind(u) {
        try {
          const x = new URL(u);
          const p = x.pathname;
          if (/docs\.google\.com/i.test(x.host)) {
            if (/\/spreadsheets/i.test(p)) return ['📊', 'Google Sheet'];
            if (/\/presentation/i.test(p)) return ['📽️', 'Google Slides'];
            if (/\/forms/i.test(p)) return ['📝', 'Google Form'];
            return ['📄', 'Google Doc'];
          }
          if (/drive\.google\.com/i.test(x.host)) {
            return /folders/i.test(p) ? ['📁', 'Drive Folder'] : ['📎', 'Drive File'];
          }
        } catch (e) {}
        return ['🔗', 'Web Link'];
      }

      function formatDate(ts) {
        if (!ts) return '—';
        try {
          return new Date(ts).toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
        } catch (e) {
          return '—';
        }
      }

      function formatRelativeTime(ts) {
        if (!ts) return 'Never signed in';
        const diff = Math.max(0, Date.now() - ts);
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return 'Active just now';
        if (mins < 60) return `Active ${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `Active ${hrs}h ago`;
        return `Last seen ${formatDate(ts)}`;
      }

      function copyToClipboard(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('Copied to clipboard', 'success');
        } catch (e) {
          showToast('Could not copy automatically', 'error');
        }
      }

      function showToast(message, type = 'info') {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const colors = {
          success: 'border-emerald-500/30 bg-emerald-500/15 text-emerald-800 dark:text-emerald-200',
          error: 'border-red-500/30 bg-red-500/15 text-red-800 dark:text-red-200',
          info: 'border-blue-500/30 bg-blue-500/15 text-blue-800 dark:text-blue-200'
        };
        const el = document.createElement('div');
        el.className = `pointer-events-auto hig-glass px-4 py-2.5 rounded-2xl border shadow-hig-md text-xs font-semibold animate-fade-in ${colors[type] || colors.info}`;
        el.textContent = message;
        root.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 2800);
      }

      function openModal(title, subtitle, bodyHtml, onMount, maxWidthClass = 'max-w-lg') {
        const root = document.getElementById('modal-root');
        if (!root) return;
        root.innerHTML = `
          <div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
            <div class="w-full ${maxWidthClass} hig-glass bg-white/95 dark:bg-[#151922]/95 border border-black/10 dark:border-white/10 rounded-3xl shadow-hig-lg p-5 sm:p-6 my-auto animate-fade-in max-h-[92vh] overflow-y-auto">
              <div class="flex items-start justify-between gap-3 mb-4 pb-3 border-b border-black/[0.06] dark:border-white/[0.07]">
                <div>
                  <h3 class="text-sm font-bold text-slate-900 dark:text-white">${escapeHtml(title)}</h3>
                  ${subtitle ? `<p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">${escapeHtml(subtitle)}</p>` : ''}
                </div>
                <button type="button" id="modal-x" class="p-1.5 rounded-xl text-slate-400 hover:text-slate-800 dark:hover:text-white hover:bg-black/5 dark:hover:bg-white/10 transition" aria-label="Close">✕</button>
              </div>
              <div>${bodyHtml}</div>
            </div>
          </div>
        `;
        document.getElementById('modal-x').onclick = closeModal;
        document.getElementById('modal-backdrop').onclick = (e) => {
          if (e.target.id === 'modal-backdrop') closeModal();
        };
        if (typeof onMount === 'function') onMount();
      }

      function closeModal() {
        const root = document.getElementById('modal-root');
        if (root) root.innerHTML = '';
      }

      function openConfirmModal(title, message, onConfirm) {
        openModal(title, '', `
          <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed mb-5">${escapeHtml(message)}</p>
          <div class="flex justify-end gap-2">
            <button type="button" id="cfm-cancel" class="px-4 py-2 rounded-xl text-xs font-medium border border-black/10 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/5">Cancel</button>
            <button type="button" id="cfm-ok" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 hover:bg-red-700 text-white">Remove</button>
          </div>
        `, () => {

        async function handleAuthSubmit(role, slotIndex, uVal, pVal, errId, submitBtnId) {
          if (Date.now() < state.lockUntil) return;
          const submitBtn = document.getElementById(submitBtnId);
          const errEl = document.getElementById(errId);
          const card = document.getElementById('login-card');

          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="w-3.5 h-3.5 border-2 border-white/40 border-t-white rounded-full animate-spin"></span><span>Verifying with Supabase…</span>`;
          }

          const matched = await authenticateWithSupabase(role, slotIndex, uVal, pVal);
          if (matched) {
            state.failedAttempts = 0;
            state.lockUntil = 0;
            state.user = Object.assign({}, matched, { title: matched.title || matched.wing });
            try { sessionStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify({ role: matched.role, id: matched.id })); } catch (err) {}
            showToast(`${role === 'admin' ? 'Admin' : 'Officer'} verified: ${matched.name}`, 'success');
            renderApp();
            syncPullFromSupabase(true);
          } else {
            state.failedAttempts += 1;
            if (state.failedAttempts >= 5) {
              state.lockUntil = Date.now() + 20000;
              state.failedAttempts = 0;
              setTimeout(() => { if (!state.user) renderLogin(); }, 20200);
            }
            if (submitBtn) {
              const locked = Math.max(0, Math.ceil((state.lockUntil - Date.now()) / 1000));
              submitBtn.disabled = locked > 0;
              submitBtn.innerHTML = `${ICONS.lock}<span>${locked > 0 ? `Locked (${locked}s)` : (role === 'admin' ? 'Authenticate Admin' : 'Authenticate Officer')}</span>`;
            }
            errEl.textContent = state.lockUntil > Date.now()
              ? 'Too many failed attempts. Please wait 20 seconds.'
              : 'Access denied. Invalid encrypted ID or passkey.';
            errEl.classList.remove('hidden');
            card.classList.remove('animate-shake');
            void card.offsetWidth;
            card.classList.add('animate-shake');
          }
        }

        if (isAdmSeg) {
          document.querySelectorAll('.slot-btn').forEach(btn => {
            btn.onclick = () => {
              state.loginSlot = Number(btn.getAttribute('data-slot'));
              renderLogin();
            };
          });
          const passInput = document.getElementById('adm-pass');
          const togglePass = document.getElementById('toggle-pass');
          togglePass.onclick = () => {
            const isPwd = passInput.type === 'password';
            passInput.type = isPwd ? 'text' : 'password';
            togglePass.textContent = isPwd ? 'Hide' : 'Show';
          };
          document.getElementById('login-form').onsubmit = (e) => {
            e.preventDefault();
            handleAuthSubmit('admin', activeSlot ? activeSlot.slot : 0, document.getElementById('adm-user').value, passInput.value, 'login-err', 'adm-submit');
          };
          document.getElementById('adm-user').focus();
        } else {
          document.querySelectorAll('.off-slot-btn').forEach(btn => {
            btn.onclick = () => {
              state.officerSlot = Number(btn.getAttribute('data-off-slot'));
              renderLogin();
            };
          });
          const offPass = document.getElementById('off-pass');
          const toggleOffPass = document.getElementById('toggle-off-pass');
          toggleOffPass.onclick = () => {
            const isPwd = offPass.type === 'password';
            offPass.type = isPwd ? 'text' : 'password';
            toggleOffPass.textContent = isPwd ? 'Hide' : 'Show';
          };
          document.getElementById('officer-form').onsubmit = (e) => {
            e.preventDefault();
            handleAuthSubmit('officer', activeOfficer ? activeOfficer.slot : 0, document.getElementById('off-user').value, offPass.value, 'off-err', 'off-submit');
          };
          document.getElementById('off-user').focus();
        }
      }

        const officerOptions = getOfficerDirectory()
          .filter(o => o.active !== false)
          .map(o => `<option value="${escapeHtml(o.name)}|${escapeHtml(o.code)}|${escapeHtml(o.title || o.wing)}">${escapeHtml(o.name)} (${escapeHtml(o.code)})</option>`)
          .join('');

        openModal('Assign Official Work Order / Task', 'Creates a printable A4 order sheet assigned to an officer.', `
          <form id="f-task" class="space-y-3.5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

            </div>

            </div>
            <div id="fr-err" class="hidden text-xs text-red-500"></div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" id="fr-cancel" class="px-4 py-2 rounded-xl text-xs font-medium border border-black/10 dark:border-white/10">Cancel</button>
              <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white">Save Resource</button>
            </div>
          </form>
        `, () => {
          let mode = 'one';
          const b1 = document.getElementById('rm-one');
          const b2 = document.getElementById('rm-many');
          const box1 = document.getElementById('r-one-box');
          const box2 = document.getElementById('r-many-box');
          b1.onclick = () => {
            mode = 'one';
            box1.classList.remove('hidden'); box2.classList.add('hidden');
            b1.className = 'py-1.5 rounded-lg text-xs font-semibold bg-white dark:bg-[#232938] shadow-sm';
            b2.className = 'py-1.5 rounded-lg text-xs font-semibold text-slate-500';
          };
          b2.onclick = () => {
            mode = 'many';
            box2.classList.remove('hidden'); box1.classList.add('hidden');
            b2.className = 'py-1.5 rounded-lg text-xs font-semibold bg-white dark:bg-[#232938] shadow-sm';
            b1.className = 'py-1.5 rounded-lg text-xs font-semibold text-slate-500';

            e.preventDefault();
            const cat = document.getElementById('fr-cat').value;
            const err = document.getElementById('fr-err');
            const added = [];
            if (mode === 'one') {
              const u = normalizeUrl(document.getElementById('fr-url').value);
              if (!u) { err.textContent = 'Enter a valid URL starting with https://'; err.classList.remove('hidden'); return; }
              const title = document.getElementById('fr-title').value.trim() || `${detectLinkKind(u)[1]} · ${new URL(u).host}`;
              added.push({ id: 'res_' + Date.now(), title, url: u, desc: document.getElementById('fr-desc').value.trim(), cat, by: state.user.name, at: Date.now() });
            } else {
              const lines = document.getElementById('fr-bulk').value.split(/\n+/);
              lines.forEach((line, idx) => {
                const s = line.trim();
                if (!s) return;
                const parts = s.split('|');
                const rawUrl = parts.pop();
                const u = normalizeUrl(rawUrl);
                if (!u) return;
                const title = parts.join('|').trim() || `${detectLinkKind(u)[1]} · ${new URL(u).host}`;
                added.push({ id: `res_${Date.now()}_${idx}`, title, url: u, desc: '', cat, by: state.user.name, at: Date.now() + idx });
              });
              if (!added.length) { err.textContent = 'No valid links found.'; err.classList.remove('hidden'); return; }
            }
            for (let i = 0; i < added.length; i++) {
              state.resources.unshift(added[i]);
              await pushRecordToSupabase('resources', added[i]);
            }
            closeModal();
            showToast(`Added ${added.length} resource(s)`, 'success');
            renderApp();
          };
        });
      }

                    <div class="text-xs font-bold text-slate-900 dark:text-white truncate">${escapeHtml(o.name)} <span class="text-[10px] font-normal text-slate-400">(${escapeHtml(o.code)})</span></div>
                    <div class="text-[10px] text-slate-400 truncate">${escapeHtml(o.title || o.wing)} · ${escapeHtml(formatRelativeTime(o.last_login_at))}</div>
                  </div>
                  <button type="button" data-toggle-user="${escapeHtml(o.id)}" class="toggle-user-btn px-2.5 py-1 rounded-lg text-[10px] font-semibold transition ${
                    o.active !== false
                      ? 'bg-emerald-500/15 text-emerald-700 dark:text-emerald-300 hover:bg-red-500/15 hover:text-red-600'
                      : 'bg-red-500/15 text-red-600 dark:text-red-400 hover:bg-emerald-500/15 hover:text-emerald-600'
                  }">${o.active !== false ? 'Active' : 'Disabled'}</button>
                </div>
              `).join('')}
            </div>

            <form id="f-add-officer" class="pt-4 border-t border-black/10 dark:border-white/10 space-y-3">
              <div class="text-[10px] font-bold uppercase tracking-widest text-slate-500">Add New Officer Account (Encrypted)</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <input id="no-name" required placeholder="Full Name" class="px-3 py-2 rounded-xl text-xs bg-white dark:bg-[#0E1118] border border-black/10 dark:border-white/10" />
                <input id="no-code" required placeholder="Short Role (e.g. EXEC)" class="px-3 py-2 rounded-xl text-xs bg-white dark:bg-[#0E1118] border border-black/10 dark:border-white/10" />
                <input id="no-wing" required placeholder="Position / Wing" class="px-3 py-2 rounded-xl text-xs bg-white dark:bg-[#0E1118] border border-black/10 dark:border-white/10" />
                <input id="no-login" required placeholder="Unique Login ID" class="px-3 py-2 rounded-xl text-xs bg-white dark:bg-[#0E1118] border border-black/10 dark:border-white/10" />
              </div>
              <input id="no-pass" type="password" minlength="6" required placeholder="Initial Passkey (min 6 chars)" class="w-full px-3 py-2 rounded-xl text-xs bg-white dark:bg-[#0E1118] border border-black/10 dark:border-white/10" />
              <div class="flex justify-end gap-2 pt-1">
                <button type="button" id="no-close" class="px-4 py-2 rounded-xl text-xs font-medium border border-black/10 dark:border-white/10">Close</button>
                <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white">Create &amp; Sync Officer</button>
              </div>
            </form>
          </div>
        `, () => {
          document.getElementById('no-close').onclick = closeModal;
          document.querySelectorAll('.toggle-user-btn').forEach(btn => {
            btn.onclick = async () => {
              const target = state.users.find(u => u.id === btn.getAttribute('data-toggle-user'));
              if (!target) return;
              target.active = target.active === false ? true : false;
              await upsertUserToSupabase(target);
              showToast(`${target.name} ${target.active ? 'enabled' : 'disabled'}`, 'info');
              openManageAccessModal();
              renderApp();
            };
          });
          document.getElementById('f-add-officer').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('no-name').value.trim();
            const code = document.getElementById('no-code').value.trim().toUpperCase();
            const wing = document.getElementById('no-wing').value.trim();
            const loginId = document.getElementById('no-login').value.trim().toLowerCase();
            const pass = document.getElementById('no-pass').value;
            const nextSlot = getOfficerDirectory().reduce((m, o) => Math.max(m, Number(o.slot || 0)), -1) + 1;
            const initials = name.split(/\s+/).map(p => p[0] || '').join('').slice(0, 2).toUpperCase() || 'OF';
            const newOfficer = {
              id: `ESRC-${code.replace(/[^A-Z0-9]/g, '')}-${String(nextSlot + 1).padStart(2, '0')}`,
              role: 'officer',
              slot: nextSlot,
              code,
              name,
              title: wing,
              wing,
              avatar: initials,
              accent: 'from-sky-500 to-indigo-600',
              seal: sealCredential(nextSlot, loginId, pass),
              active: true,
              last_login_at: null
            };
            await upsertUserToSupabase(newOfficer);
            showToast(`Officer ${name} created & synced`, 'success');
            closeModal();
            renderApp();
          };
        });
      }

      /* =========================================================================
       * 12. MAIN APPLICATION SHELL RENDERER
       * ========================================================================= */
      function renderApp() {
        if (!state.user) {
          renderLogin();
          return;
        }

        const app = document.getElementById('app');
        const navItems = [
          { id: 'home', label: 'Overview', icon: ICONS.home },

          { id: 'applications', label: 'Applications', icon: ICONS.applications, count: state.applications.filter(a => a.status === 'pending').length },
          { id: 'members', label: 'Members', icon: ICONS.members, count: state.members.filter(m => m.status !== 'alumni').length },
          { id: 'alumni', label: 'Alumni', icon: ICONS.alumni, count: state.members.filter(m => m.status === 'alumni').length },
          { id: 'messages', label: 'Messages', icon: ICONS.messages, count: (() => {
            if (isAdmin()) {
              return (state.messages || []).filter(m => !m.read).length;
            } else {
              return (state.messages || []).filter(m => (m.toId === state.user.id || m.toCode === state.user.code) && !m.read).length;
            }

          { id: 'notices', label: 'Notices', icon: ICONS.notices },
          { id: 'tools', label: 'Tools', icon: ICONS.tools },
          { id: 'resources', label: 'Resources', icon: ICONS.resources }

                <div class="text-[10px] text-slate-400 truncate">Officers Portal</div>
              </div>
            </div>

            <nav class="space-y-1 flex-1">

                  <div class="min-w-0 flex-1">
                    <div class="text-xs font-semibold text-slate-900 dark:text-white truncate">${escapeHtml(state.user.name)}</div>

                  </div>
                </div>

                  </button>
                </div>
              </div>
            </div>
          </div>
        `;

        const viewContent =
          state.view === 'tasks' ? renderTasksView()

        app.innerHTML = `

            <!-- Main Column -->
            <div class="flex-1 flex flex-col min-w-0">

                      : cloudSetup

                      : 'bg-black/5 dark:bg-white/5 border-black/10 dark:border-white/10 text-slate-500 dark:text-slate-400'
                  }">
                    <span class="w-2 h-2 rounded-full ${cloudSynced ? 'bg-emerald-500' : cloudSetup ? 'bg-amber-500 animate-pulse' : 'bg-slate-400'}"></span>

                <span>Embedded System Research Center · Daffodil International University</span>
                <span>Supabase Auth · HIG · Roboto Mono</span>
              </footer>

              <!-- Mobile Bottom Quick Nav -->
              <nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 hig-glass bg-white/90 dark:bg-[#11151E]/90 border-t border-black/10 dark:border-white/10 px-2 py-1.5 grid grid-cols-5 gap-1">
                ${[
                  { id: 'home', label: 'Home', icon: ICONS.home },
                  { id: 'tasks', label: 'Orders', icon: ICONS.tasks },
                  { id: 'members', label: 'Members', icon: ICONS.members },
                  { id: 'alumni', label: 'Alumni', icon: ICONS.alumni },
                  { id: 'applications', label: 'Apps', icon: ICONS.applications }
                ].map(m => `
                  <button data-nav="${m.id}" class="nav-btn flex flex-col items-center justify-center py-1.5 rounded-xl text-[10px] font-semibold transition ${
                    state.view === m.id
                      ? 'text-blue-600 dark:text-blue-400 bg-blue-500/10'
                      : 'text-slate-500 dark:text-slate-400'
                  }">
                    ${m.icon}
                    <span class="mt-0.5">${m.label}</span>
                  </button>
                `).join('')}
              </nav>
            </div>
          </div>
        `;

        // Navigation & Shell Bindings
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.onclick = () => {
            state.view = btn.getAttribute('data-nav');
            state.mobileMenu = false;
            renderApp();
          };
        });
        const btnMenu = document.getElementById('btn-menu');
        if (btnMenu) btnMenu.onclick = () => { state.mobileMenu = !state.mobileMenu; renderApp(); };
        const mobBg = document.getElementById('mob-backdrop');
        if (mobBg) mobBg.onclick = (e) => { if (e.target.id === 'mob-backdrop') { state.mobileMenu = false; renderApp(); } };

        document.getElementById('btn-theme').onclick = () => { toggleTheme(); renderApp(); };
        document.getElementById('btn-cloud-sync').onclick = () => {
          if (state.cloudStatus === 'setup-needed' || state.authCloudStatus === 'setup-needed') openSupabaseSetupModal();
          else syncPullFromSupabase(false);
        };

        document.querySelectorAll('.btn-passkey').forEach(b => {
          b.onclick = () => { state.mobileMenu = false; openChangePasskeyModal(); };
        });
        document.querySelectorAll('.btn-logout').forEach(b => {
          b.onclick = () => {
            state.user = null;
            state.mobileMenu = false;
            try { sessionStorage.removeItem(STORAGE_KEYS.SESSION); } catch (e) {}
            showToast('Signed out safely', 'info');
            renderLogin();
          };
        });

        // Overview actions
        const btnManageAccess = document.getElementById('btn-manage-access');
        if (btnManageAccess) btnManageAccess.onclick = openManageAccessModal;
        const homeNewTask = document.getElementById('home-new-task');
        if (homeNewTask) homeNewTask.onclick = openTaskModal;
        const homeNewApp = document.getElementById('home-new-app');
        if (homeNewApp) homeNewApp.onclick = openApplicationModal;

        // Copy buttons
        document.querySelectorAll('.copy-btn').forEach(b => {
          b.onclick = () => copyToClipboard(b.getAttribute('data-copy'));
        });

        // Notices actions
        const btnNewNotice = document.getElementById('btn-new-notice');
        if (btnNewNotice) btnNewNotice.onclick = openNoticeModal;
        document.querySelectorAll('.del-notice-btn').forEach(b => {
          b.onclick = () => {
            const id = b.getAttribute('data-del-notice');
            openConfirmModal('Remove Notice', 'Are you sure you want to delete this notice?', async () => {
              await deleteRecordFromSupabase('notices', id);
              showToast('Notice removed', 'info');
              renderApp();
            });
          };
        });

        // Work Orders & Tasks actions
        const btnNewTask = document.getElementById('btn-new-task');
        if (btnNewTask) btnNewTask.onclick = openTaskModal;
        const taskSearch = document.getElementById('task-search');
        if (taskSearch) {
          taskSearch.oninput = (e) => {
            state.taskQuery = e.target.value;
            renderApp();
            const again = document.getElementById('task-search');
            if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
          };
        }
        document.querySelectorAll('.tf-btn').forEach(b => {
          b.onclick = () => { state.taskFilter = b.getAttribute('data-tf'); renderApp(); };
        });
        document.querySelectorAll('.print-task-btn').forEach(b => {
          b.onclick = () => {
            const t = state.tasks.find(x => x.id === b.getAttribute('data-print-task'));
            if (t) openA4PreviewModal(t.orderNo || 'Work Order', buildA4WorkOrderHtml(t));
          };
        });
        document.querySelectorAll('.submit-task-btn').forEach(b => {
          b.onclick = () => {
            const t = state.tasks.find(x => x.id === b.getAttribute('data-submit-task'));
            if (t) openSubmitTaskModal(t);
          };
        });
        document.querySelectorAll('.review-task-btn').forEach(b => {
          b.onclick = () => {
            const t = state.tasks.find(x => x.id === b.getAttribute('data-review-task'));
            if (t) openReviewTaskModal(t);
          };
        });
        document.querySelectorAll('.del-task-btn').forEach(b => {
          b.onclick = () => {
            const id = b.getAttribute('data-del-task');
            openConfirmModal('Delete Work Order', 'This will permanently remove the work order from Supabase.', async () => {
              await deleteRecordFromSupabase('tasks', id);
              showToast('Work Order deleted', 'info');
              renderApp();
            });
          };
        });

        // Applications actions
        const btnNewApp = document.getElementById('btn-new-app');
        if (btnNewApp) btnNewApp.onclick = openApplicationModal;
        const appSearch = document.getElementById('app-search');
        if (appSearch) {
          appSearch.oninput = (e) => {
            state.appQuery = e.target.value;
            renderApp();
            const again = document.getElementById('app-search');
            if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
          };
        }
        document.querySelectorAll('.af-btn').forEach(b => {
          b.onclick = () => { state.appFilter = b.getAttribute('data-af'); renderApp(); };
        });
        document.querySelectorAll('.at-btn').forEach(b => {
          b.onclick = () => { state.appTypeFilter = b.getAttribute('data-at'); renderApp(); };
        });
        document.querySelectorAll('.print-app-btn').forEach(b => {
          b.onclick = () => {
            const a = state.applications.find(x => x.id === b.getAttribute('data-print-app'));
            if (a) openA4PreviewModal(a.refNo || 'Application', buildA4ApplicationHtml(a));
          };
        });
        document.querySelectorAll('.review-app-btn').forEach(b => {
          b.onclick = () => {
            const a = state.applications.find(x => x.id === b.getAttribute('data-review-app'));
            if (a) openReviewAppModal(a);
          };
        });
        document.querySelectorAll('.del-app-btn').forEach(b => {
          b.onclick = () => {
            const id = b.getAttribute('data-del-app');
            openConfirmModal('Delete Application', 'This will permanently remove the application from Supabase.', async () => {
              await deleteRecordFromSupabase('applications', id);
              showToast('Application deleted', 'info');
              renderApp();
            });
          };
        });

        
        
        // Messages View Bindings
        const btnNewMsg = document.getElementById('btn-new-message');
        if (btnNewMsg) {
          btnNewMsg.onclick = () => openSendMessageModal();
        }

        // Quick message buttons on Home officer cards
        document.querySelectorAll('.btn-quick-msg').forEach(b => {
          b.onclick = (e) => {
            e.stopPropagation();
            const officerId = b.getAttribute('data-officer-id');
            openSendMessageModal(officerId);
          };
        });

        // Search and Filters
        const msgSearch = document.getElementById('msg-search');
        if (msgSearch) {
          msgSearch.oninput = (e) => {
            state.messageQuery = e.target.value;
            renderApp();
            const inp = document.getElementById('msg-search');
            if (inp) {
              inp.focus();
              inp.setSelectionRange(inp.value.length, inp.value.length);
            }
          };
        }

        const clearMsgSearch = document.getElementById('clear-msg-search');
        if (clearMsgSearch) {
          clearMsgSearch.onclick = () => {
            state.messageQuery = '';
            renderApp();
          };
        }

        const msgOfficerFilter = document.getElementById('msg-officer-filter');
        if (msgOfficerFilter) {
          msgOfficerFilter.onchange = (e) => {
            state.messageOfficerFilter = e.target.value;
            renderApp();
          };
        }

        const msgPriorityFilter = document.getElementById('msg-priority-filter');
        if (msgPriorityFilter) {
          msgPriorityFilter.onchange = (e) => {
            state.messagePriorityFilter = e.target.value;
            renderApp();
          };
        }

        const msgStatusFilter = document.getElementById('msg-status-filter');
        if (msgStatusFilter) {
          msgStatusFilter.onchange = (e) => {
            state.messageStatusFilter = e.target.value;
            renderApp();
          };
        }

        // View and Delete message buttons
        document.querySelectorAll('.view-msg-btn').forEach(b => {
          b.onclick = () => {
            const id = b.getAttribute('data-id');
            openViewMessageModal(id);
          };
        });

        document.querySelectorAll('.del-msg-btn').forEach(b => {
          b.onclick = () => {
            const id = b.getAttribute('data-id');
            deleteMessage(id);
          };
        });

        // Members View Bindings
        const btnNewMember = document.getElementById('btn-new-member');
        if (btnNewMember) btnNewMember.onclick = () => openMemberModal(null, 'active');
        const btnExportMembers = document.getElementById('btn-export-members');
        if (btnExportMembers) btnExportMembers.onclick = () => openExportModal('members');

        const memberSearch = document.getElementById('member-search');
        if (memberSearch) {
          memberSearch.oninput = (e) => {
            state.memberQuery = e.target.value;
            state.memberPage = 1;
            renderApp();
            const el = document.getElementById('member-search');
            if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
          };
        }
        const clearMemberSearch = document.getElementById('clear-member-search');
        if (clearMemberSearch) {
          clearMemberSearch.onclick = () => {
            state.memberQuery = '';
            state.memberPage = 1;
            renderApp();
          };
        }

        const memberBatchFilter = document.getElementById('member-batch-filter');
        if (memberBatchFilter) memberBatchFilter.onchange = (e) => { state.memberBatchFilter = e.target.value; state.memberPage = 1; renderApp(); };
        const memberYearFilter = document.getElementById('member-year-filter');
        if (memberYearFilter) memberYearFilter.onchange = (e) => { state.memberYearFilter = e.target.value; state.memberPage = 1; renderApp(); };
        const memberRoleFilter = document.getElementById('member-role-filter');
        if (memberRoleFilter) memberRoleFilter.onchange = (e) => { state.memberRoleFilter = e.target.value; state.memberPage = 1; renderApp(); };
        const memberPaymentFilter = document.getElementById('member-payment-filter');
        if (memberPaymentFilter) memberPaymentFilter.onchange = (e) => { state.memberPaymentFilter = e.target.value; state.memberPage = 1; renderApp(); };

        const memberPageSize = document.getElementById('member-page-size');
        if (memberPageSize) memberPageSize.onchange = (e) => { state.memberPageSize = e.target.value; state.memberPage = 1; renderApp(); };

          b.onclick = () => { state.memberPage = parseInt(b.getAttribute('data-page'), 10); renderApp(); };

        // Master checkbox for members

      function setMemberStatus(memberId, newStatus) {
        const m = state.members.find(x => x.id === memberId);
        if (!m) return;
        const oldStatus = m.status;
        m.status = newStatus;
        saveJSON(STORAGE_KEYS.MEMBERS, state.members);
        pushRecordToSupabase('members', m);
        
        // Clear selection if present
        state.memberSelected = state.memberSelected.filter(id => id !== memberId);
        state.alumniSelected = state.alumniSelected.filter(id => id !== memberId);

        if (newStatus === 'alumni') {
          showToast(`"${escapeHtml(m.name)}" moved to Alumni directory`, 'info');
        } else {
          showToast(`"${escapeHtml(m.name)}" restored to Active Members`, 'success');
        }
        renderApp();
      }

      function deleteMember(memberId) {
        const m = state.members.find(x => x.id === memberId);
        if (!m) return;
        openConfirmModal('Remove Member', `Are you sure you want to permanently remove "${m.name}" (${m.studentId}) from the directory?`, async () => {
          state.members = state.members.filter(x => x.id !== memberId);
          state.memberSelected = state.memberSelected.filter(id => id !== memberId);
          state.alumniSelected = state.alumniSelected.filter(id => id !== memberId);
          saveJSON(STORAGE_KEYS.MEMBERS, state.members);
          await deleteRecordFromSupabase('members', memberId);
          showToast('Member removed from directory', 'info');
          renderApp();
        });
      }

                colBoxes.forEach(cb => cb.checked = !allChecked);

              e.preventDefault();

              const rangeStart = parseInt(document.getElementById('export-range-start')?.value || '1', 10);
              const rangeEnd = parseInt(document.getElementById('export-range-end')?.value || String(sourceList.length), 10);

      function exportMembersData(targetType, format, scope, columns, countVal, rangeStart, rangeEnd, filteredList) {
        const isAlumni = targetType === 'alumni';
        const sourceList = state.members.filter(m => isAlumni ? m.status === 'alumni' : m.status !== 'alumni');
        const selectedIds = isAlumni ? state.alumniSelected : state.memberSelected;

        let records = [];
        if (scope === 'all') {
          records = sourceList.slice();
        } else if (scope === 'filtered') {
          records = filteredList.slice();
        } else if (scope === 'selected') {
          records = sourceList.filter(m => selectedIds.includes(m.id));
        } else if (scope === 'count') {
          records = sourceList.slice(0, Math.max(1, countVal));
        } else if (scope === 'range') {
          const s = Math.max(0, rangeStart - 1);
          const e = Math.min(sourceList.length, Math.max(s + 1, rangeEnd));
          records = sourceList.slice(s, e);
        }

        if (!records.length) {
          showToast('No matching records to export', 'error');
          return;
        }

        const colLabels = {
          name: 'Name',
          studentId: 'Student ID',
          email: 'Email',
          contact: 'Contact',
          enrollmentYear: 'Enrollment Year',
          batch: 'Batch',
          designation: 'Serial Number / Role',
          payment: 'Payment',
          status: 'Membership Status'
        };

        // Prepare tabular data
        const exportData = records.map(m => {
          const row = {};
          columns.forEach(col => {
            const label = colLabels[col] || col;
            let val = m[col] ?? '';
            if (col === 'status') val = val === 'alumni' ? 'Alumni' : 'Active Member';
            row[label] = val;
          });
          return row;
        });

        const dateStr = new Date().toISOString().split('T')[0];
        const baseFilename = `ESRC_${isAlumni ? 'Alumni' : 'Members'}_${records.length}_records_${dateStr}`;

        if (format === 'xlsx' && window.XLSX && typeof window.XLSX.utils?.json_to_sheet === 'function') {
          try {
            const ws = window.XLSX.utils.json_to_sheet(exportData);
            // Auto size columns
            const colWidths = columns.map(c => {
              const label = colLabels[c] || c;
              let maxLen = label.length;
              records.forEach(r => {
                const val = String(r[c] || '');
                if (val.length > maxLen) maxLen = Math.min(40, val.length);
              });
              return { wch: maxLen + 3 };
            });
            ws['!cols'] = colWidths;

            const wb = window.XLSX.utils.book_new();
            window.XLSX.utils.book_append_sheet(wb, ws, isAlumni ? 'Alumni' : 'Members');
            window.XLSX.writeFile(wb, `${baseFilename}.xlsx`);
            showToast(`Exported ${records.length} records to Excel (.xlsx)`, 'success');
            return;
          } catch (err) {
            console.error('SheetJS export error, falling back to CSV', err);
          }
        }

        // CSV Fallback (or if user selected CSV)
        const csvHeader = columns.map(c => `"${(colLabels[c] || c).replace(/"/g, '""')}"`).join(',');
        const csvRows = records.map(r => {
          return columns.map(c => {
            let val = r[c] ?? '';
            if (c === 'status') val = val === 'alumni' ? 'Alumni' : 'Active Member';
            return `"${String(val).replace(/"/g, '""')}"`;
          }).join(',');
        });

        const csvContent = '\uFEFF' + [csvHeader].concat(csvRows).join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${baseFilename}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast(`Exported ${records.length} records to CSV`, 'success');
      }
