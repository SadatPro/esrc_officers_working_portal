      function renderMessagesView() {
        const isAdm = isAdmin();
        const officers = getOfficerDirectory();
        const q = (state.messageQuery || '').toLowerCase().trim();
        const pFilter = state.messagePriorityFilter || 'all';
        const sFilter = state.messageStatusFilter || 'all';
        const oFilter = state.messageOfficerFilter || 'all';

        // Filter messages for current user
        let msgs = (state.messages || []).filter(m => {
          if (!isAdm) {
            // General officers only see messages sent to them
            if (m.toId !== state.user.id && m.toCode !== state.user.code) return false;
          }
          if (q) {
            const haystack = `${m.subject} ${m.body} ${m.toName} ${m.toCode} ${m.fromName}`.toLowerCase();
            if (!haystack.includes(q)) return false;
          }
          if (pFilter !== 'all' && m.priority !== pFilter) return false;
          if (sFilter === 'unread' && m.read) return false;
          if (sFilter === 'read' && !m.read) return false;
          if (isAdm && oFilter !== 'all' && m.toId !== oFilter && m.toCode !== oFilter) return false;
          return true;
        });

        // Analytics
        const totalSentOrRecv = isAdm
          ? (state.messages || []).length
          : (state.messages || []).filter(m => m.toId === state.user.id || m.toCode === state.user.code).length;
        const unreadCount = isAdm
          ? (state.messages || []).filter(m => !m.read).length
          : (state.messages || []).filter(m => (m.toId === state.user.id || m.toCode === state.user.code) && !m.read).length;
        const urgentCount = isAdm
          ? (state.messages || []).filter(m => m.priority === 'urgent').length
          : (state.messages || []).filter(m => (m.toId === state.user.id || m.toCode === state.user.code) && m.priority === 'urgent').length;

        return `
          <div class="space-y-6 animate-fade-in">
            <!-- Header Section -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <div class="flex items-center gap-2.5">
                  <h2 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">
                    ${isAdm ? 'Officer Direct Communications' : 'Personal Directives & Messages'}
                  </h2>
                  <span class="text-xs px-2.5 py-0.5 rounded-full font-bold font-mono ${
                    unreadCount > 0 ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400' : 'bg-blue-500/10 text-blue-600 dark:text-blue-400'
                  }">
                    ${unreadCount} Unread
                  </span>
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                  ${isAdm
                    ? 'Confidential directives, instructions, and 1-on-1 personal communications from President to individual officers.'
                    : 'Confidential 1-on-1 communications and administrative directives from Executive Leadership.'}
                </p>
              </div>
              <div class="flex flex-wrap items-center gap-2.5">
                ${isAdm ? `
                  <button type="button" id="btn-new-message" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition">
                    ${ICONS.plus}<span>Send Personal Message</span>
                  </button>
                ` : ''}
              </div>
            </div>

            <!-- KPI Metric Tiles -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
              <div class="p-4 rounded-2xl hig-glass bg-white/70 dark:bg-[#151922]/70 border border-black/[0.06] dark:border-white/[0.07]">
                <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  ${isAdm ? 'Total Sent Messages' : 'Total Directives'}
                </div>
                <div class="text-2xl font-bold text-blue-600 dark:text-blue-400 mt-1 font-mono">${totalSentOrRecv}</div>
                <div class="text-[10px] text-slate-400 mt-0.5">Recorded in Registry</div>
              </div>
              <div class="p-4 rounded-2xl hig-glass bg-white/70 dark:bg-[#151922]/70 border border-black/[0.06] dark:border-white/[0.07]">
                <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  ${isAdm ? 'Pending Read Receipts' : 'Unread Directives'}
                </div>
                <div class="text-2xl font-bold ${unreadCount > 0 ? 'text-amber-600 dark:text-amber-400' : 'text-emerald-600 dark:text-emerald-400'} mt-1 font-mono">${unreadCount}</div>
                <div class="text-[10px] text-slate-400 mt-0.5">${unreadCount > 0 ? 'Awaiting acknowledgment' : 'All up to date'}</div>
              </div>
              <div class="p-4 rounded-2xl hig-glass bg-white/70 dark:bg-[#151922]/70 border border-black/[0.06] dark:border-white/[0.07]">
                <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">Urgent Directives</div>
                <div class="text-2xl font-bold text-red-600 dark:text-red-400 mt-1 font-mono">${urgentCount}</div>
                <div class="text-[10px] text-slate-400 mt-0.5">Priority Notifications</div>
              </div>
            </div>

            <!-- Search & Filters Toolbar -->
            <div class="p-4 rounded-2xl hig-glass bg-white/80 dark:bg-[#151922]/80 border border-black/[0.07] dark:border-white/[0.08] shadow-hig-sm space-y-3">
              <div class="flex flex-col md:flex-row gap-2.5">
                <div class="relative flex-1">
                  <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-slate-400">🔍</span>
                  <input type="text" id="msg-search" value="${escapeHtml(state.messageQuery || '')}" placeholder="Search message subject, directive content, or officer..." class="w-full pl-9 pr-8 py-2.5 rounded-xl text-xs bg-black/[0.04] dark:bg-white/[0.05] border border-black/10 dark:border-white/10 focus:outline-none focus:ring-2 focus:ring-blue-500/40 text-slate-900 dark:text-white" />
                  ${state.messageQuery ? `<button type="button" id="clear-msg-search" class="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-white text-xs">✕</button>` : ''}
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  ${isAdm ? `
                    <select id="msg-officer-filter" class="px-3 py-2 rounded-xl text-xs bg-black/[0.04] dark:bg-white/[0.05] border border-black/10 dark:border-white/10 text-slate-700 dark:text-slate-300">
                      <option value="all" ${oFilter === 'all' ? 'selected' : ''}>All Officers</option>
                      ${officers.map(o => `<option value="${escapeHtml(o.id)}" ${oFilter === o.id ? 'selected' : ''}>[${escapeHtml(o.code)}] ${escapeHtml(o.name)}</option>`).join('')}
                    </select>
                  ` : ''}
                  <select id="msg-priority-filter" class="px-3 py-2 rounded-xl text-xs bg-black/[0.04] dark:bg-white/[0.05] border border-black/10 dark:border-white/10 text-slate-700 dark:text-slate-300">
                    <option value="all" ${pFilter === 'all' ? 'selected' : ''}>All Priorities</option>
                    <option value="urgent" ${pFilter === 'urgent' ? 'selected' : ''}>⚠️ Urgent Directives</option>
                    <option value="normal" ${pFilter === 'normal' ? 'selected' : ''}>Normal Messages</option>
                  </select>
                  <select id="msg-status-filter" class="px-3 py-2 rounded-xl text-xs bg-black/[0.04] dark:bg-white/[0.05] border border-black/10 dark:border-white/10 text-slate-700 dark:text-slate-300">
                    <option value="all" ${sFilter === 'all' ? 'selected' : ''}>All Statuses</option>
                    <option value="unread" ${sFilter === 'unread' ? 'selected' : ''}>Unread Only</option>
                    <option value="read" ${sFilter === 'read' ? 'selected' : ''}>Read Only</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Messages List -->
            <div class="space-y-3">
              ${msgs.length ? msgs.map(m => {
                const isUnread = !m.read;
                const isUrgent = m.priority === 'urgent';
                const avatar = isAdm ? (m.toAvatar || m.toCode || 'OF') : (m.fromAvatar || 'SM');
                return `
                  <div class="hig-card hig-glass rounded-2xl p-4 sm:p-5 border transition ${
                    isUnread
                      ? 'bg-blue-500/[0.03] dark:bg-blue-500/[0.05] border-blue-500/30 dark:border-blue-500/40 shadow-hig-sm'
                      : 'bg-white/80 dark:bg-[#151922]/80 border-black/[0.07] dark:border-white/[0.08]'
                  }">
                    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                      <div class="flex items-start gap-3.5 min-w-0">
                        <span class="w-10 h-10 rounded-xl bg-gradient-to-br ${
                          isUrgent ? 'from-rose-600 to-red-600' : 'from-blue-600 to-indigo-600'
                        } text-white font-bold text-xs flex items-center justify-center shrink-0 shadow-sm mt-0.5">
                          ${escapeHtml(avatar)}
                        </span>
                        <div class="min-w-0 flex-1">
                          <div class="flex flex-wrap items-center gap-2 mb-1">
                            <span class="text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${
                              isUrgent ? 'bg-red-500/15 text-red-600 dark:text-red-400 font-extrabold border border-red-500/30' : 'bg-blue-500/10 text-blue-600 dark:text-blue-400'
                            }">
                              ${isUrgent ? '⚠️ Urgent Directive' : 'Personal Directive'}
                            </span>
                            <span class="text-[10px] font-semibold text-slate-700 dark:text-slate-300">
                              ${isAdm ? `To: <strong>${escapeHtml(m.toName)}</strong> (${escapeHtml(m.toCode)})` : `From: <strong>${escapeHtml(m.fromName)}</strong> (${escapeHtml(m.fromRole)})`}
                            </span>
                            <span class="text-[10px] text-slate-400">· ${formatRelativeTime(m.at)}</span>
                            ${isUnread ? `
                              <span class="inline-flex items-center gap-1 text-[9px] font-bold uppercase px-2 py-0.5 rounded-full bg-blue-500 text-white">
                                <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                                New
                              </span>
                            ` : ''}
                          </div>
                          <h4 class="text-xs sm:text-sm font-bold text-slate-900 dark:text-white truncate">
                            ${escapeHtml(m.subject)}
                          </h4>
                          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 line-clamp-2 leading-relaxed">
                            ${escapeHtml(m.body)}
                          </p>
                          <div class="flex flex-wrap items-center gap-3 mt-3 pt-2.5 border-t border-black/[0.05] dark:border-white/[0.05] text-[10px]">
                            <span class="text-slate-400">Sent: ${formatDate(m.at)}</span>
                            ${isAdm ? `
                              <span class="${m.read ? 'text-emerald-600 dark:text-emerald-400 font-medium' : 'text-amber-600 dark:text-amber-400'}">
                                ${m.read ? `✓✓ Read by officer (${formatRelativeTime(m.readAt)})` : '✓ Delivered (Pending Read)'}
                              </span>
                            ` : `
                              <span class="${m.read ? 'text-slate-400' : 'text-blue-600 dark:text-blue-400 font-semibold'}">
                                ${m.read ? '✓ Read' : '● Unread Directive'}
                              </span>
                            `}
                          </div>
                        </div>
                      </div>
                      <div class="flex items-center gap-1.5 shrink-0 self-end sm:self-center">
                        <button type="button" class="view-msg-btn px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition" data-id="${m.id}">
                          ${!m.read && !isAdm ? 'Read Directive' : 'View Message'}
                        </button>
                        ${isAdm ? `
                          <button type="button" class="del-msg-btn p-1.5 rounded-xl text-slate-400 hover:text-red-600 dark:hover:text-red-400 hover:bg-red-500/10 transition" data-id="${m.id}" title="Delete Message">
                            🗑️
                          </button>
                        ` : ''}
                      </div>
                    </div>
                  </div>
                `;
              }).join('') : `
                <div class="p-12 text-center rounded-2xl hig-glass bg-white/60 dark:bg-[#151922]/60 border border-dashed border-black/15 dark:border-white/15">
                  <div class="text-3xl mb-2">💬</div>
                  <div class="text-xs font-bold text-slate-900 dark:text-white">No messages found</div>
                  <p class="text-[11px] text-slate-400 mt-1 max-w-sm mx-auto">
                    ${isAdm ? 'Click "+ Send Personal Message" above or the message button on any officer card to deliver a direct communication.' : 'You have no personal directives matching your current filter.'}
                  </p>
                </div>
              `}
            </div>
          </div>
        `;
      }

      function openSendMessageModal(preselectedOfficerId = null) {
        if (!isAdmin()) {
          showToast('Only Executive Admin can issue personal directives', 'error');
          return;
        }
        const officers = getOfficerDirectory();
        if (!officers.length) {
          showToast('No active officers found in directory', 'error');
          return;
        }

        const bodyHtml = `
          <form id="form-send-msg" class="space-y-4">
            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                Recipient Officer <span class="text-red-500">*</span>
              </label>
              <select id="msg-to-officer" required class="w-full px-3.5 py-2.5 rounded-xl text-xs bg-black/[0.04] dark:bg-white/[0.05] border border-black/10 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                <option value="">-- Select Officer --</option>
                ${officers.map(o => `
                  <option value="${escapeHtml(o.id)}" data-code="${escapeHtml(o.code)}" data-name="${escapeHtml(o.name)}" data-avatar="${escapeHtml(o.avatar)}" ${preselectedOfficerId === o.id || preselectedOfficerId === o.code ? 'selected' : ''}>
                    [${escapeHtml(o.code)}] ${escapeHtml(o.name)} · ${escapeHtml(o.title || 'General Officer')}
                  </option>
                `).join('')}
              </select>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                  Priority Directive
                </label>
                <select id="msg-priority" class="w-full px-3.5 py-2.5 rounded-xl text-xs bg-black/[0.04] dark:bg-white/[0.05] border border-black/10 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                  <option value="normal">Normal Communication</option>
                  <option value="urgent">⚠️ Urgent Directive (High Priority)</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                  Sender Identity
                </label>
                <input type="text" disabled value="${escapeHtml(state.user.name)} (${escapeHtml(state.user.title || 'President · ESRC DIU')})" class="w-full px-3.5 py-2.5 rounded-xl text-xs bg-black/[0.02] dark:bg-white/[0.02] border border-black/10 dark:border-white/10 text-slate-500 cursor-not-allowed" />
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                Directive Subject / Topic <span class="text-red-500">*</span>
              </label>
              <input type="text" id="msg-subject" required placeholder="e.g. Lab Inventory Audit, Component Requisition, Event Setup..." class="w-full px-3.5 py-2.5 rounded-xl text-xs bg-black/[0.04] dark:bg-white/[0.05] border border-black/10 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/40" />
            </div>

            <div>
              <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">
                Directive Content / Instructions <span class="text-red-500">*</span>
              </label>
              <textarea id="msg-body" rows="6" required placeholder="Write the confidential directive or personal message to this officer..." class="w-full px-3.5 py-2.5 rounded-xl text-xs bg-black/[0.04] dark:bg-white/[0.05] border border-black/10 dark:border-white/10 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500/40 leading-relaxed font-mono"></textarea>
            </div>

            <div class="flex items-center justify-end gap-2.5 pt-3 border-t border-black/[0.06] dark:border-white/[0.07]">
              <button type="button" id="msg-cancel" class="px-4 py-2 rounded-xl text-xs font-semibold border border-black/10 dark:border-white/10 hover:bg-black/5 dark:hover:bg-white/5 transition">
                Cancel
              </button>
              <button type="submit" class="inline-flex items-center gap-1.5 px-5 py-2 rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition">
                ${ICONS.send}<span>Deliver Message</span>
              </button>
            </div>
          </form>
        `;

        openModal('Send Personal Message to Officer', 'Direct confidential communication delivered to the officer\'s personal portal inbox.', bodyHtml, () => {
          const cancelBtn = document.getElementById('msg-cancel');
          if (cancelBtn) cancelBtn.onclick = closeModal;

          const form = document.getElementById('form-send-msg');
          if (form) {
            form.onsubmit = (e) => {
              e.preventDefault();
              const sel = document.getElementById('msg-to-officer');
              const toId = sel.value;
              if (!toId) {
                showToast('Please select a recipient officer', 'error');
                return;
              }
              const opt = sel.options[sel.selectedIndex];
              const toName = opt.getAttribute('data-name');
              const toCode = opt.getAttribute('data-code');
              const toAvatar = opt.getAttribute('data-avatar');
              const priority = document.getElementById('msg-priority').value;
              const subject = document.getElementById('msg-subject').value.trim();
              const body = document.getElementById('msg-body').value.trim();

              if (!subject || !body) {
                showToast('Subject and message content are required', 'error');
                return;
              }

              const newMsg = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                fromId: state.user.id,
                fromName: state.user.name,
                fromRole: state.user.title || 'President · ESRC DIU',
                fromAvatar: state.user.avatar || 'SM',
                toId: toId,
                toName: toName,
                toCode: toCode,
                toTitle: 'General Officer',
                toAvatar: toAvatar || toCode,
                subject: subject,
                body: body,
                priority: priority,
                at: Date.now(),
                read: false,
                readAt: null
              };

              state.messages.unshift(newMsg);
              saveJSON(STORAGE_KEYS.MESSAGES, state.messages);
              pushRecordToSupabase('messages', newMsg);
              closeModal();
              showToast(`Personal message delivered to ${toName} (${toCode})!`, 'success');
              renderApp();
            };
          }
        }, 'max-w-lg');
      }

      function openViewMessageModal(msgId) {
        const m = (state.messages || []).find(x => x.id === msgId);
        if (!m) return;

        // If recipient officer reads unread message, mark read
        if (!isAdmin() && (m.toId === state.user.id || m.toCode === state.user.code) && !m.read) {
          m.read = true;
          m.readAt = Date.now();
          saveJSON(STORAGE_KEYS.MESSAGES, state.messages);
          pushRecordToSupabase('messages', m);
        }

        const isUrgent = m.priority === 'urgent';
        const isAdm = isAdmin();

        const bodyHtml = `
          <div class="space-y-4">
            <!-- Header Badges -->
            <div class="flex flex-wrap items-center justify-between gap-2 p-3 rounded-2xl bg-black/[0.03] dark:bg-white/[0.04] border border-black/[0.06] dark:border-white/[0.07]">
              <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${
                  isUrgent ? 'bg-red-500/20 text-red-600 dark:text-red-400 font-extrabold border border-red-500/30' : 'bg-blue-500/20 text-blue-600 dark:text-blue-400'
                }">
                  ${isUrgent ? '⚠️ Urgent Directive' : 'Personal Directive'}
                </span>
                <span class="text-[11px] text-slate-500 dark:text-slate-400">${formatDate(m.at)} (${formatRelativeTime(m.at)})</span>
              </div>
              <div class="text-[10px] font-semibold">
                ${m.read
                  ? `<span class="text-emerald-600 dark:text-emerald-400">✓✓ Read ${formatRelativeTime(m.readAt)}</span>`
                  : `<span class="text-amber-600 dark:text-amber-400">✓ Delivered · Pending Read</span>`}
              </div>
            </div>

            <!-- Sender & Recipient Metadata -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div class="p-3 rounded-xl bg-black/[0.02] dark:bg-white/[0.02] border border-black/[0.05] dark:border-white/[0.05]">
                <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">From (Sender)</div>
                <div class="text-xs font-bold text-slate-900 dark:text-white mt-0.5">${escapeHtml(m.fromName)}</div>
                <div class="text-[11px] text-blue-600 dark:text-blue-400">${escapeHtml(m.fromRole)}</div>
              </div>
              <div class="p-3 rounded-xl bg-black/[0.02] dark:bg-white/[0.02] border border-black/[0.05] dark:border-white/[0.05]">
                <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400">To (Recipient Officer)</div>
                <div class="text-xs font-bold text-slate-900 dark:text-white mt-0.5">${escapeHtml(m.toName)}</div>
                <div class="text-[11px] text-slate-500 dark:text-slate-400">${escapeHtml(m.toCode)} · ${escapeHtml(m.toTitle || 'General Officer')}</div>
              </div>
            </div>

            <!-- Subject -->
            <div>
              <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Subject</div>
              <h3 class="text-sm font-bold text-slate-900 dark:text-white p-3 rounded-xl bg-black/[0.02] dark:bg-white/[0.02] border border-black/[0.05] dark:border-white/[0.05]">
                ${escapeHtml(m.subject)}
              </h3>
            </div>

            <!-- Full Message Body -->
            <div>
              <div class="text-[10px] uppercase font-bold tracking-wider text-slate-400 mb-1">Message Content</div>
              <div class="p-4 rounded-xl bg-black/[0.03] dark:bg-white/[0.04] border border-black/[0.07] dark:border-white/[0.08] text-xs text-slate-800 dark:text-slate-200 leading-relaxed font-mono whitespace-pre-wrap">
${escapeHtml(m.body)}
              </div>
            </div>

            <!-- Footer Actions -->
            <div class="flex items-center justify-between gap-2.5 pt-3 border-t border-black/[0.06] dark:border-white/[0.07]">
              <div>
                ${isAdm ? `
                  <button type="button" id="btn-modal-del-msg" class="text-xs font-semibold text-red-600 dark:text-red-400 hover:underline">
                    Delete Message
                  </button>
                ` : ''}
              </div>
              <button type="button" id="btn-modal-close-msg" class="px-5 py-2 rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition">
                Done / Close
              </button>
            </div>
          </div>
        `;

        openModal('Officer Directive', `Directive Ref: ${m.id}`, bodyHtml, () => {
          const closeBtn = document.getElementById('btn-modal-close-msg');
          if (closeBtn) closeBtn.onclick = () => { closeModal(); renderApp(); };

          const delBtn = document.getElementById('btn-modal-del-msg');
          if (delBtn) {
            delBtn.onclick = () => {
              closeModal();
              deleteMessage(m.id);
            };
          }
        }, 'max-w-lg');
      }

      function deleteMessage(msgId) {
        const m = (state.messages || []).find(x => x.id === msgId);
        if (!m) return;
        openConfirmModal('Delete Message', `Are you sure you want to permanently delete directive "${m.subject}"?`, async () => {
          state.messages = state.messages.filter(x => x.id !== msgId);
          saveJSON(STORAGE_KEYS.MESSAGES, state.messages);
          await deleteRecordFromSupabase('messages', msgId);
          showToast('Message deleted', 'info');
          renderApp();
        });
      }

      /* =========================================================================
       * 13. BOOTSTRAP
       * ========================================================================= */
      function restoreSession() {
        try {
          const raw = sessionStorage.getItem(STORAGE_KEYS.SESSION);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (parsed && parsed.id) {
            const found = state.users.find(u => u.id === parsed.id && u.active !== false);
            if (found) {
              state.user = Object.assign({}, found, { title: found.title || found.wing });
            }
          }
        } catch (e) {}
      }

      function boot() {
        initTheme();
        restoreSession();
        if (state.user) renderApp();
        else renderLogin();
        syncPullFromSupabase(true);
        startSupabaseAutoSync();
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
